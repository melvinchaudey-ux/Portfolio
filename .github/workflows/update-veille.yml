name: Mise a jour veille technologique
on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire le flux
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          feeds = [
              ("Cisco Security", "https://sec.cloudapps.cisco.com/security/center/psirtrss20/CiscoSecurityAdvisory.xml"),
              ("BleepingComputer", "https://www.bleepingcomputer.com/feed/")
          ]
          articles = []

          for source, url in feeds:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Portfolio-Veille/1.0"})
                  raw = urllib.request.urlopen(req, timeout=20).read()
                  root = ET.fromstring(raw)
                  for item in root.findall(".//item")[:8]:
                      title = (item.findtext("title") or "").strip()
                      link = (item.findtext("link") or "").strip()
                      desc = (item.findtext("description") or "").strip()
                      pub = (item.findtext("pubDate") or "").strip()
                      if title and link:
                          articles.append({
                              "source": source,
                              "title": title,
                              "link": link,
                              "description": desc[:220],
                              "date": pub
                          })
              except Exception as exc:
                  print(f"{source}: {exc}")

          payload = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "articles": articles[:12],
              "sources": [
                  {"name": "Cisco Security", "url": "https://sec.cloudapps.cisco.com/security/center/rss.x?i=44"},
                  {"name": "BleepingComputer", "url": "https://www.bleepingcomputer.com/rss-feeds/"},
                  {"name": "Microsoft Security", "url": "https://www.microsoft.com/en-us/security/blog/"}
              ]
          }

          with open("veille.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
          PY
      - name: Publier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veille.json
          git diff --cached --quiet || (git commit -m "chore: update veille technologique" && git push)
